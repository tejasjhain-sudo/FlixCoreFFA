# All sounds are configurable and optional.
# Sound names must match Bukkit Sound enum names for your server version.

sounds:
  join:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.8
    pitch: 1.2
  leave:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.7
    pitch: 0.8
  kill:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    pitch: 1.4
  death:
    enabled: true
    sound: ENTITY_WITHER_HURT
    volume: 0.5
    pitch: 1.0
  respawn-countdown:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 0.6
    pitch: 1.0
